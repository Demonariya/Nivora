name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-workspace:
    name: Rust workspace checks (host; no WinCairo runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check shell-only bootstrap feature set
        run: cargo check -p nivora-app --no-default-features --features bootstrap --locked

  windows-rust-typecheck:
    name: Windows Rust type-check (no native bridge compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Linux host dependencies for Slint build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Type-check Windows Rust code
        env:
          NIVORA_SKIP_WEBKIT_NATIVE_FOR_CHECK: "1"
        run: cargo check --workspace --exclude nivora-storage --target x86_64-pc-windows-msvc --locked
      - name: Type-check Windows bootstrap cdylib feature set
        run: cargo check -p nivora-app --no-default-features --features bootstrap --target x86_64-pc-windows-msvc --locked

  windows-native:
    name: Windows WinCairo integration (manual; requires pre-provisioned self-hosted SDK runner)
    if: ${{ github.event_name == 'workflow_dispatch' && vars.WEBKIT_SDK_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, webkit-wincairo]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Validate WebKit SDK environment
        shell: pwsh
        run: |
          if (-not $env:WEBKIT_INCLUDE_DIR -or -not $env:WEBKIT_LIB_DIR -or -not $env:WEBKIT_RUNTIME_DIR) {
            throw 'WEBKIT_INCLUDE_DIR, WEBKIT_LIB_DIR, and WEBKIT_RUNTIME_DIR must be provisioned by the runner.'
          }
          if (-not (Test-Path (Join-Path $env:WEBKIT_INCLUDE_DIR 'WebKit/WKView.h'))) {
            throw 'WinCairo public headers are missing.'
          }
          if (-not (Test-Path (Join-Path $env:WEBKIT_LIB_DIR 'WebKit2.lib'))) {
            throw 'WebKit2.lib is missing.'
          }
      - name: Verify actual WebKit DLL exports
        shell: pwsh
        run: ./scripts/verify-webkit-exports.ps1 -WebKitDll (Join-Path $env:WEBKIT_RUNTIME_DIR 'WebKit2.dll')
      - name: Format
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Compile native application
        run: cargo build --release -p nivora-app

  windows-cef-native:
    name: Windows CEF bootstrap client build (manual; pre-provisioned SDK + bootstrap)
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CEF_SDK_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, cef-windows-x64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Rust application DLL, CEF client and stage matching bootstrap
        shell: pwsh
        env:
          NIVORA_CEF_ROOT: ${{ vars.NIVORA_CEF_ROOT }}
          NIVORA_CEF_BOOTSTRAP: ${{ vars.NIVORA_CEF_BOOTSTRAP }}
        run: ./scripts/build-cef-native.ps1
